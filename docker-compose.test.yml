# Test stack — deployed via Dockhand git stack from this repo.
# Uses pre-built GHCR images with the rolling `beta` tag.
# Ports: 3100 (web), 3002 (API) — offset from production to avoid conflicts.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    networks:
      my-network:
        aliases:
          - hc-beta-postgres
    environment:
      POSTGRES_USER: homekit
      POSTGRES_PASSWORD: homekit-test
      POSTGRES_DB: homekit_events
      TZ: ${TZ:-America/Indianapolis}
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homekit -d homekit_events"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  listener:
    image: ghcr.io/havuq/homechronicle/listener:beta
    restart: unless-stopped
    networks:
      my-network:
        aliases:
          - hc-beta-listener
      empire-network:
    ports:
      - "${API_PORT:-3002}:${API_PORT:-3002}"
    environment:
      DATABASE_URL: postgresql://homekit:homekit-test@hc-beta-postgres:5432/homekit_events
      API_PORT: ${API_PORT:-3002}
      API_TOKEN: ${API_TOKEN:-test-environment-token}
      NODE_ENV: production
      TZ: ${TZ:-America/Indianapolis}
    volumes:
      - listener-data-test:/app/data
      - ${HOST_DBUS_SOCKET:-/run/dbus/system_bus_socket}:/run/dbus/system_bus_socket:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const http=require('http');const port=process.env.API_PORT||3002;
          const req=http.get({host:'127.0.0.1',port,path:'/api/health',timeout:5000},
          (res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));
          req.on('timeout',()=>{req.destroy();process.exit(1);});"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/havuq/homechronicle/web:beta
    restart: unless-stopped
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "${WEB_PORT:-3100}:80"
    environment:
      LISTENER_HOST: ${LISTENER_HOST:-hc-beta-listener}
      LISTENER_PORT: ${LISTENER_PORT:-${API_PORT:-3002}}
      API_TOKEN: ${API_TOKEN:-test-environment-token}
      TZ: ${TZ:-America/Indianapolis}

networks:
  my-network:
    external: true
  empire-network:
    external: true

volumes:
  postgres-data-test:
  listener-data-test:
