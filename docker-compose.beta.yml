# Beta stack — deployed via Dockhand git stack from this repo.
# Builds images from source on every deploy (no Docker Hub dependency).
# Ports: 3100 (web), 3002 (API) — offset from production to avoid conflicts.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    networks:
      my-network:
        aliases:
          - hc-beta-postgres
    entrypoint: ["/usr/local/bin/ensure-password.sh"]
    environment:
      POSTGRES_USER: homekit
      POSTGRES_PASSWORD: ${BETA_DB_PASSWORD}
      POSTGRES_DB: homekit_events
      TZ: ${TZ:-America/Indianapolis}
    volumes:
      - /mnt/Primary/apps/hc-beta/postgres-data-beta:/var/lib/postgresql/data
      - ./docker/postgres-ensure-password.sh:/usr/local/bin/ensure-password.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${BETA_DB_PASSWORD} psql -U homekit -d homekit_events -c 'SELECT 1' -q 2>/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot prod→beta data refresh, run before the listener on each (re)created
  # deploy. Prod postgres is NOT published to the host loopback — but it shares the
  # external my-network with beta, so db-sync reaches each postgres by its
  # in-network name: beta at hc-beta-postgres:5432 and prod at PROD_DB_HOST (its
  # container name, default homechronicle-postgres-1). This needs no change to the
  # prod stack. NOTE: a `restart: no` one-shot only runs when its container is
  # recreated; `service_completed_successfully` is satisfied by a prior exited-0
  # container and will NOT force a re-run — the deploy must recreate db-sync
  # (down+up / --force-recreate) to refresh.
  db-sync:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: "no"
    networks:
      - my-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROD_DB_HOST: ${PROD_DB_HOST:-homechronicle-postgres-1}
      PROD_DB_PORT: ${PROD_DB_PORT:-5432}
      PROD_DB_USER: ${PROD_DB_USER}
      PROD_DB_NAME: ${PROD_DB_NAME}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
      BETA_DB_HOST: hc-beta-postgres
      BETA_DB_PORT: 5432
      BETA_DB_USER: homekit
      BETA_DB_NAME: homekit_events
      BETA_DB_PASSWORD: ${BETA_DB_PASSWORD}
      SYNC_REQUIRED: ${SYNC_REQUIRED:-false}
      PROD_DATA_DIR: /prod
      BETA_DATA_DIR: /app/data
      TZ: ${TZ:-America/Indianapolis}
    volumes:
      - ./docker/beta-db-sync.sh:/usr/local/bin/beta-db-sync.sh:ro
      - ./docker/beta-sync-tables.sh:/usr/local/bin/beta-sync-tables.sh:ro
      - /mnt/Primary/apps/hc-beta/listener-data-beta:/app/data
      - /mnt/Primary/apps/homechronicle/listener_data:/prod:ro
    entrypoint: ["/usr/local/bin/beta-db-sync.sh"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  listener:
    build:
      context: ./listener
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      my-network:
        aliases:
          - hc-beta-listener
      empire-network:
        ipv4_address: 10.0.0.195
    ports:
      - "127.0.0.1:${API_PORT:-3002}:${API_PORT:-3002}"
    environment:
      DATABASE_URL: postgresql://homekit:${BETA_DB_PASSWORD}@hc-beta-postgres:5432/homekit_events
      API_PORT: ${API_PORT:-3002}
      API_TOKEN: ${API_TOKEN}
      NODE_ENV: production
      # -- Phase 20/21 auth (multi-user, invites, password reset) --
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Session cookie Secure flag. Kept OFF by default: with it on, the new
      # session cookie did not round-trip through the Traefik->nginx chain and
      # login looped (POST /login 200 then GET /me 401). Opt back in via
      # SESSION_COOKIE_SECURE=true in .env.beta once the proxy chain is verified.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Two proxies in front (Traefik -> web/nginx) — key auth rate limits per real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Public base URL used to build invite + password-reset email links.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BETA_FQDN}}
      TZ: ${TZ:-America/Indianapolis}
    volumes:
      - /mnt/Primary/apps/hc-beta/listener-data-beta:/app/data
      - /mnt/Primary/apps/homechronicle/listener_data:/prod
      - ${HOST_DBUS_SOCKET:-/run/dbus/system_bus_socket}:/run/dbus/system_bus_socket:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const http=require('http');const port=process.env.API_PORT||3002;
          const req=http.get({host:'127.0.0.1',port,path:'/api/health',timeout:5000},
          (res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));
          req.on('timeout',()=>{req.destroy();process.exit(1);});"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_BUILD_VERSION: ${VITE_BUILD_VERSION:-beta}
    restart: unless-stopped
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "${WEB_PORT:-3100}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hc-beta.rule=Host(`${BETA_FQDN}`)"
      - "traefik.http.routers.hc-beta.entrypoints=websecure"
      - "traefik.http.routers.hc-beta.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hc-beta.middlewares=secured-ng@file"
      - "traefik.http.services.hc-beta.loadbalancer.server.port=80"
    environment:
      LISTENER_HOST: ${LISTENER_HOST:-hc-beta-listener}
      LISTENER_PORT: ${LISTENER_PORT:-${API_PORT:-3002}}
      API_TOKEN: ${API_TOKEN}
      # Must match the listener's AUTH_ENABLED so nginx token suppression stays consistent (SEC-07)
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      TZ: ${TZ:-UTC}

networks:
  my-network:
    external: true
  empire-network:
    external: true
