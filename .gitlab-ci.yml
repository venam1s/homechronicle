# GitLab CI — mirrors the GitHub Actions workflows in .github/workflows/
# Keep both configs in the repo so switching back to GitHub is a one-line remote change.

stages:
  - test
  - deploy
  - prepare
  - build
  - release

variables:
  NODE_VERSION: "20"
  DOCKER_HUB_NAMESPACE: "havuq"

# ── Test (replaces .github/workflows/ci.yml) ────────────────────────────────
# Runs on merge requests to main, on version tags, and on manual/API BUILD_TAG
# builds — every pipeline that can reach a build job must run this first (M-11).
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "web"
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "api"
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "trigger"
  cache:
    - key: listener-$CI_COMMIT_REF_SLUG
      paths: [listener/node_modules/]
    - key: web-$CI_COMMIT_REF_SLUG
      paths: [web/node_modules/]
  before_script:
    - apk add --no-cache python3 make g++ linux-headers
  script:
    # Subshells keep each line self-contained — if `npm ci` or `npm test` fails
    # in listener, we don't need a corresponding `cd ..` (the subshell exits
    # back to the original cwd automatically). Without this, a failure in the
    # listener line would leave the shell inside listener/ and the next line's
    # `cd web` would fail with "No such file or directory" — a misleading
    # secondary error that hid the real failure (#13133398452 in pipeline
    # 2486952137 was bitten by this).
    - (cd listener && npm ci && npm test)
    # truenas-shared-runner's docker executor pins build containers to
    # cpus=2/memory=2g in config.toml, but os.availableParallelism() is not
    # cgroup-aware and reports the nuc host's 8 CPUs, so vitest would spawn
    # 7 jsdom workers onto 2 real cores. That oversubscription blew the
    # waitFor/testTimeout budgets and has flaked `main` since 2026-06-15.
    # nuc repro: 7 workers = 253s wall / 416s tests vs 2 workers = 130s wall
    # / 81s tests.
    - (cd web && npm ci && npm test -- --maxWorkers=2)

# ── SAST (replaces .github/workflows/codeql.yml) ────────────────────────────
include:
  - template: Jobs/SAST.gitlab-ci.yml

sast:
  stage: test
  variables:
    SAST_EXCLUDED_ANALYZERS: "bandit, brakeman, flawfinder, gosec, kubesec, phpcs-security-audit, pmd-apex, security-code-scan, sobelow, spotbugs"

# ── Release validation + matrix setup ────────────────────────────────────────
# Only runs on version tags (v*).
validate-release:
  stage: prepare
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "api"
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "trigger"
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$BUILD_TAG}"
      BETA_RE='^v([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$'
      STABLE_RE='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'

      if echo "$TAG" | grep -qE "$BETA_RE"; then
        echo "RELEASE_KIND=beta" >> release.env
        echo "IS_PRERELEASE=true" >> release.env
      elif echo "$TAG" | grep -qE "$STABLE_RE"; then
        echo "RELEASE_KIND=stable" >> release.env
        echo "IS_PRERELEASE=false" >> release.env
      else
        echo "ERROR: Tag '$TAG' does not match vX.Y.Z or vX.Y.Z-beta.N"
        exit 1
      fi

      echo "Release tag $TAG validated ($(cat release.env | grep RELEASE_KIND))"
  artifacts:
    reports:
      dotenv: release.env

# ── Build + push to Docker Hub (replaces .github/workflows/docker.yml) ──────
.build-base:
  stage: build
  image: docker:27
  # No DinD service — CI jobs use the host Docker socket (/var/run/docker.sock)
  # mounted by the self-hosted runner's config.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "api"
    - if: $BUILD_TAG && $CI_PIPELINE_SOURCE == "trigger"
  needs:
    - job: validate-release
      artifacts: true
      optional: true
    # Non-optional on purpose (M-11): optional: true would silently drop this
    # gate if a future rules change stopped `test` from matching, whereas a
    # non-optional need fails pipeline *creation* loudly instead. test.rules
    # must stay a superset of these build rules or pipeline creation breaks.
    - job: test
      artifacts: false
  variables:
    BUILD_PLATFORMS: "linux/amd64,linux/arm64"
    # Use the host Docker socket (mounted by the self-hosted runner). The
    # docker:27 image otherwise defaults to tcp://docker:2376 (DinD service)
    # which doesn't exist in this setup.
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    # Register QEMU emulators for cross-platform builds (arm64 on amd64 runner, or vice versa)
    - docker run --rm --privileged tonistiigi/binfmt --install all
    - docker buildx create --name multiarch --driver docker-container --use
    - docker buildx inspect --bootstrap
    # Install Trivy
    - |
      TRIVY_VERSION="0.69.3"
      curl -sSfL -o /tmp/trivy.tar.gz \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
  script:
    - |
      IMAGE="${DOCKER_HUB_NAMESPACE}/homechronicle-${SERVICE}"
      EFFECTIVE_TAG="${CI_COMMIT_TAG:-$BUILD_TAG}"
      VERSION="${EFFECTIVE_TAG#v}"

      # Build a single-platform image for Trivy scanning using buildx so the
      # layer cache is shared with the multi-platform build that follows.
      echo "Building ${IMAGE}:${VERSION} (native arch) for scanning..."
      docker buildx build \
        --load \
        --build-arg VITE_BUILD_VERSION="${EFFECTIVE_TAG}" \
        -f "${DOCKERFILE}" \
        -t "${IMAGE}:scan" \
        "${CONTEXT}"

      echo "Running Trivy vulnerability scan..."
      trivy image --format table --severity CRITICAL,HIGH --ignore-unfixed "${IMAGE}:scan" || true

      # Build + push multi-platform image
      echo "Building and pushing ${IMAGE}:${VERSION} (${BUILD_PLATFORMS})..."

      TAGS="-t ${IMAGE}:${VERSION}"

      if [ "$IS_PRERELEASE" = "true" ]; then
        TAGS="${TAGS} -t ${IMAGE}:beta"
      else
        MAJOR_MINOR=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')
        MAJOR=$(echo "$VERSION" | sed -E 's/^([0-9]+)\..*/\1/')
        TAGS="${TAGS} -t ${IMAGE}:${MAJOR_MINOR}"
        TAGS="${TAGS} -t ${IMAGE}:${MAJOR}"
        TAGS="${TAGS} -t ${IMAGE}:latest"
      fi

      docker buildx build \
        --platform "${BUILD_PLATFORMS}" \
        --build-arg VITE_BUILD_VERSION="${EFFECTIVE_TAG}" \
        -f "${DOCKERFILE}" \
        ${TAGS} \
        --push \
        "${CONTEXT}"

      echo "Pushed ${IMAGE}:${VERSION} (${BUILD_PLATFORMS})"

build-listener:
  extends: .build-base
  variables:
    SERVICE: listener
    CONTEXT: ./listener
    DOCKERFILE: ./listener/Dockerfile

build-web:
  extends: .build-base
  variables:
    SERVICE: web
    CONTEXT: ./web
    DOCKERFILE: ./web/Dockerfile

build-standalone:
  extends: .build-base
  timeout: 3h
  variables:
    SERVICE: standalone
    CONTEXT: "."
    DOCKERFILE: ./Dockerfile.standalone
  rules:
    # Only build standalone for stable releases (not betas)
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "web" && $BUILD_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
    - if: $CI_PIPELINE_SOURCE == "api" && $BUILD_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BUILD_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# ── GitLab Release (auto-created from version tags) ─────────────────────────
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: validate-release
      artifacts: true
    # Non-optional (M-11): its only rule ($CI_COMMIT_TAG =~ /^v/) is already
    # covered by test.rules, so this gate can never silently vanish.
    - job: test
      artifacts: false
  script:
    - |
      TAG="${CI_COMMIT_TAG}"
      VERSION="${TAG#v}"

      if [ "$IS_PRERELEASE" = "true" ]; then
        NAME="v${VERSION} (beta)"
      else
        NAME="v${VERSION}"
      fi

      # Extract this version's changelog section (between ## [version] headers)
      NOTES=$(sed -n "/^## \\[${VERSION}\\]/,/^## \\[/{ /^## \\[${VERSION}\\]/d; /^## \\[/d; p; }" CHANGELOG.md)

      if [ -z "$NOTES" ]; then
        NOTES="Release ${TAG}"
      fi

      # Write notes to a file so special characters don't break the CLI args
      echo "$NOTES" > /tmp/release-notes.md

      release-cli create \
        --name "$NAME" \
        --tag-name "$TAG" \
        --description "$(cat /tmp/release-notes.md)"

# ── Beta deploy (triggers Dockhand async sync on every push to main) ─────────
# WHY THIS JOB EXISTS (and why it replaces the GitLab project push webhook):
#
# The old setup used a GitLab project push webhook pointing at
# POST /api/git/stacks/10/webhook — a BLOCKING endpoint that rebuilds the beta
# stack from source (docker-compose.beta.yml runs `docker buildx build` on every
# deploy, which can take several minutes). GitLab.com has a hard, non-configurable
# 10-second read timeout on webhook responses. The blocking endpoint can never
# respond in time → every push to main raised Net::ReadTimeout → after enough
# consecutive failures GitLab auto-disables the webhook → silent loss of
# beta auto-deploy.
#
# This job uses the ASYNC /sync endpoint instead. /sync accepts the request and
# returns 2xx immediately, then builds in the background. The approach mirrors
# scripts/deploy-beta.sh, which already uses /sync successfully. The only
# difference is this job is driven by GitLab CI (no polling / DB refresh step),
# so the job finishes the moment /sync is accepted.
#
# PREREQUISITES (non-functional until both are done — see SUMMARY.md):
#   1. Add DOCKHAND_TOKEN as a masked + protected CI/CD variable in GitLab
#      project Settings → CI/CD → Variables.
#   2. Delete or disable the old push webhook targeting /api/git/stacks/10/webhook
#      so it stops firing and isn't auto-disabled by GitLab from repeated failures.
deploy-beta:
  stage: deploy
  # curlimages/curl has ENTRYPOINT ["curl"] by default — without the override
  # below, GitLab's injected shell script (which runs the `script:` block) would
  # be interpreted as curl arguments and the job would fail before any commands
  # run. This is a known GitLab gotcha for non-shell-entrypoint images; the
  # entrypoint: [""] override is a no-op when the runner already overrides
  # entrypoints and required when it doesn't.
  image:
    name: curlimages/curl:latest
    entrypoint: [""]
  # Gated on DOCKHAND_TOKEN: the job cleanly SKIPS when the token is not yet
  # configured (no failed job), and runs only once the masked CI/CD variable is
  # present. allow_failure keeps this best-effort async trigger from ever failing
  # the main pipeline — the actual deploy happens asynchronously inside Dockhand,
  # and scripts/deploy-beta.sh remains as a manual fallback.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DOCKHAND_TOKEN'
  needs: [test]
  allow_failure: true
  script:
    # LAN address: dh.venamis.net died in the Aug 2026 site move and dh.lan does
    # not resolve from the runner host; the runner (nuc) sits on the same LAN.
    - |
      curl -fsS -X POST -H "Authorization: Bearer $DOCKHAND_TOKEN" http://10.0.0.50:30328/api/git/stacks/10/sync
      echo "Triggered Dockhand async sync for beta stack 10"
