name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            listener/package-lock.json
            web/package-lock.json

      - name: Install listener dependencies
        run: npm ci --prefix listener

      - name: Run listener tests
        run: npm test --prefix listener

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Run web tests
        run: npm test --prefix web

  boot-smoke:
    name: Boot smoke
    runs-on: ubuntu-latest
    # Mirrors the boot-smoke job in .gitlab-ci.yml — see the rationale there.
    # In short: on 2026-08-31 a matter.js bump crash-looped the listener while
    # every unit test stayed green, because nothing ever ran the boot path.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homekit
          POSTGRES_PASSWORD: bootsmoke
          POSTGRES_DB: homekit_events
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homekit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://homekit:bootsmoke@127.0.0.1:5432/homekit_events
      AUTH_ENABLED: 'false'
      API_TOKEN: ci-boot-smoke-not-a-real-token
      NODE_ENV: production
      PORT: '3001'
      MATTER_STORAGE_PATH: /tmp/matter-storage
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: listener/package-lock.json

      - name: Install listener dependencies
        run: npm ci --prefix listener

      - name: Boot the listener and wait for /api/health
        working-directory: listener
        run: |
          # NODE_ENV=production points every JsonObjectStore at /app/data.
          sudo mkdir -p /app/data && sudo chmod 777 /app/data
          mkdir -p /tmp/matter-storage
          node src/index.js > /tmp/boot.log 2>&1 &
          echo $! > /tmp/boot.pid
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3001/api/health >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$(cat /tmp/boot.pid)" 2>/dev/null; then echo "LISTENER EXITED DURING BOOT"; break; fi
            sleep 1
          done
          echo '──────── listener output ────────'
          cat /tmp/boot.log
          echo '─────────────────────────────────'
          [ "$ok" = "1" ] || { echo 'FAIL: /api/health never answered'; exit 1; }
          sleep 5
          kill -0 "$(cat /tmp/boot.pid)" 2>/dev/null || { echo 'FAIL: listener exited after becoming healthy'; exit 1; }
          if grep -qiE 'FATAL|Uncaught exception' /tmp/boot.log; then echo 'FAIL: fatal error during boot'; exit 1; fi
          grep -q 'Controller started' /tmp/boot.log || { echo 'FAIL: Matter controller did not start'; exit 1; }
          echo 'boot smoke passed'

      - name: Stop the listener
        if: always()
        run: kill "$(cat /tmp/boot.pid)" 2>/dev/null || true
